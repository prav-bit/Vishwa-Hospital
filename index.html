<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vishwa Hospital — Patient Management System</title>
    <style>
:root {
  --primary: #4F46E5;
  --primary-hover: #4338CA;
  --primary-light: #EEF2FF;
  --secondary: #06B6D4;
  --accent: #F59E0B;
  --danger: #EF4444;
  --success: #10B981;
  --ink: #0F172A;
  --muted: #64748B;
  --line: #E2E8F0;
  --bg: #F1F5F9;
  --card-bg: #FFFFFF;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: linear-gradient(135deg, #F1F5F9 0%, #E0E7FF 100%);
  min-height: 100vh;
  line-height: 1.5;
}

header {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid #E0E7FF;
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: 0 4px 15px rgba(79, 70, 229, 0.08);
}

.hwrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: space-between;
}

.brand { display: flex; align-items: center; gap: 8px; }

.logo {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 3px 8px rgba(79, 70, 229, 0.3);
}

h1 { font-size: 16px; font-weight: 800; margin: 0; color: #1E1B4B; }
.tag { font-size: 10px; color: #6366F1; font-weight: 600; }

main { max-width: 1100px; margin: 0 auto; padding: 14px; }

/* SINGLE ROW STRICT TAB BAR */
.tabs {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid #C7D2FE;
  border-radius: 999px;
  padding: 4px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  width: 100%;
}

.tab {
  border: none;
  background: transparent;
  padding: 8px 10px;
  border-radius: 999px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  flex: 1;
  text-align: center;
  transition: all 0.2s ease;
}

.tab.active {
  background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%);
  color: #fff;
  box-shadow: 0 3px 10px rgba(79, 70, 229, 0.3);
}

.subtabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }

.subtab {
  border: 1px solid #CBD5E1;
  background: #fff;
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}

.subtab.active {
  background: #E0E7FF;
  color: var(--primary);
  border-color: #A5B4FC;
}

.card {
  background: var(--card-bg);
  border: 1px solid #E0E7FF;
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
}

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.row4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
@media(max-width: 760px) { .row, .row3, .row4 { grid-template-columns: 1fr; } }

label.lbl {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #475569;
  display: block;
  margin-bottom: 4px;
}

.opt { font-weight: 500; text-transform: none; letter-spacing: normal; color: #94A3B8; }

input, select, textarea {
  width: 100%;
  border: 1.5px solid #CBD5E1;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 13px;
  font-family: inherit;
  background: #F8FAFC;
  color: var(--ink);
}

input:focus, select:focus, textarea:focus {
  outline: none;
  background: #fff;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

textarea { resize: vertical; border-radius: 10px; }

.btn {
  border: none;
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-p { background: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%); color: #fff; }
.btn-a { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); color: #fff; }
.btn-o { background: #fff; border: 1.5px solid #CBD5E1; color: var(--ink); }
.btn-g { background: transparent; color: var(--muted); padding: 6px 8px; }
.btn-danger { background: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.mt { margin-top: 16px; }
.mb { margin-bottom: 12px; }
.right { display: flex; justify-content: flex-end; gap: 8px; }

h3 { font-size: 16px; font-weight: 800; margin: 0 0 4px; color: #1E1B4B; }
.sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
.divider { border-top: 1px solid #E2E8F0; margin: 16px 0; }

.pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.p-fresh { background: #D1FAE5; color: #047857; }
.p-followup { background: #FEF3C7; color: #B45309; }
.p-subsequent { background: #E0F2FE; color: #0369A1; }

.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.badge { background: #EEF2FF; color: #4338CA; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; }

table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%); color: #fff; padding: 8px; position: sticky; top: 0; }
td { padding: 8px; border-bottom: 1px solid #E2E8F0; }
tr:nth-child(even) td { background: #F8FAFC; }

.qcard {
  border: 1px solid #E2E8F0;
  border-radius: 12px;
  background: #fff;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.token {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.token .t1 { font-size: 8px; opacity: 0.8; text-transform: uppercase; }
.token .t2 { font-size: 14px; font-weight: 800; }

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  display: none;
  align-items: flex-start;
  justify-content: center;
  z-index: 50;
  padding: 16px 10px;
  overflow: auto;
}
.overlay.show { display: flex; }

.modal { background: #fff; border-radius: 16px; max-width: 800px; width: 100%; padding: 20px; max-height: 90vh; overflow: auto; }
.modal.wide { max-width: 950px; }

.empty { border: 2px dashed #CBD5E1; border-radius: 12px; background: #fff; padding: 36px; text-align: center; color: #94A3B8; }

.nutshell { border: 1px solid #FDE68A; background: #FFFBEB; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
.nutshell .nt-h { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #B45309; margin-bottom: 6px; }
.nrec { border: 1px solid #FDE68A; background: #fff; border-radius: 6px; padding: 8px; font-size: 12px; margin-bottom: 6px; }

.toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: #0F172A;
  color: #fff;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  z-index: 99;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
}
.status-dot.active { background-color: #10B981; box-shadow: 0 0 6px #10B981; }
.status-dot.inactive { background-color: #EF4444; box-shadow: 0 0 6px #EF4444; }
.exrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media(max-width:640px){ .exrow { grid-template-columns: 1fr; } }
.exbox { border: 1px solid #E2E8F0; border-radius: 10px; padding: 10px; background: #F8FAFC; }
.metrics { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 16px 0; }
@media(max-width: 900px) { .metrics { grid-template-columns: repeat(3, 1fr); } }
@media(max-width: 520px) { .metrics { grid-template-columns: repeat(2, 1fr); } }
.metric { border: 1px solid #E0E7FF; border-radius: 12px; padding: 12px; background: #fff; }
.metric .m-l { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.metric .m-v { font-size: 26px; font-weight: 800; margin-top: 4px; color: var(--primary); }
.vtable td, .vtable th { padding: 5px 6px; font-size: 11px; }
.overdue { color: var(--danger); font-weight: 700; }
.tiny { font-size: 11px; color: var(--muted); }
.flexb { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.chart { border: 1px solid #E2E8F0; border-radius: 10px; padding: 10px; margin-bottom: 12px; background: #fff; }
.chart .ct { font-size: 12px; font-weight: 700; margin-bottom: 4px; color: var(--primary); }
.legend { font-size: 10px; color: var(--muted); margin-top: 4px; }
</style>

  <body>
    <header>
      <div class="hwrap">
        <div class="brand">
          <div class="logo">🏥</div>
          <div>
            <h1>Vishwa Hospital</h1>
            <div class="tag">Patient Management</div>
          </div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-o btn-sm" onclick="syncFromFirestore(true)">
            <span id="cloudStatusDot" class="status-dot inactive"></span> Sync
          </button>
          <button class="btn btn-o btn-sm" onclick="backupData()">⬇ Backup</button>
          <button class="btn btn-o btn-sm" onclick="document.getElementById('restoreFile').click()">⬆ Restore</button>
          <input type="file" id="restoreFile" accept="application/json" style="display:none" onchange="restoreData(this)" />
        </div>
      </div>
    </header>
    <main>
      <div class="tabs">
        <button class="tab active" data-tab="staff" onclick="setTab('staff')">📋 Staff</button>
        <button class="tab" data-tab="doctor" onclick="setTab('doctor')">🩺 Doctor</button>
        <button class="tab" data-tab="reports" onclick="setTab('reports')">📊 Reports</button>
        <button class="tab" data-tab="settings" style="flex:0 0 42px;" title="Settings" onclick="setTab('settings')">⚙️</button>

      </div>
    </main>
    <div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" id="modal">
      </div>
    </div>
    <div class="toast" id="toast">
    </div>

    <!-- FIREBASE MODULE SETUP -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { 
        getFirestore, 
        collection, 
        getDocs, 
        doc, 
        setDoc,
        deleteDoc
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDAKUuLSb6SICVPWsFUpu4LSW_LkPoB9Wc",
        authDomain: "vishwa-hospital-e03c6.firebaseapp.com",
        projectId: "vishwa-hospital-e03c6",
        storageBucket: "vishwa-hospital-e03c6.firebasestorage.app",
        messagingSenderId: "315364075858",
        appId: "1:315364075858:web:b3af66cf48f792abbb728b"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db;
      window.fs = { collection, getDocs, doc, setDoc, deleteDoc };

      if (typeof window.syncFromFirestore === "function") {
        window.syncFromFirestore();
      }
    </script>

    <!-- MAIN APP LOGIC -->
    <script>
/* ============ RESILIENT STORAGE & FIREBASE SYNC ============ */
const LS_P="vishwa_patients", LS_C="vishwa_counter";
const memoryStorage = {};

function setCloudStatus(isActive) {
  const dot = document.getElementById("cloudStatusDot");
  if (dot) {
    dot.className = isActive ? "status-dot active" : "status-dot inactive";
  }
}

function safeGetItem(key) {
  try { return localStorage.getItem(key); } catch (e) { return memoryStorage[key] || null; }
}

function safeSetItem(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { memoryStorage[key] = value; }
}

function safeRemoveItem(key) {
  try { localStorage.removeItem(key); } catch (e) { delete memoryStorage[key]; }
}

function loadPatients(){ 
  try{ return JSON.parse(safeGetItem(LS_P)) || [] }catch(e){ return [] } 
}

async function savePatients(p){ 
  safeSetItem(LS_P, JSON.stringify(p)); 

  if (window.db && window.fs) {
    try {
      for (const patient of p) {
        const cleanPatient = JSON.parse(JSON.stringify(patient));
        const docId = String(patient.patient_id).replace(/\//g, "_");
        
        await window.fs.setDoc(
          window.fs.doc(window.db, "patients", docId), 
          cleanPatient, 
          { merge: true }
        );
      }
      setCloudStatus(true);
    } catch (err) {
      console.error("Firestore sync error:", err);
      setCloudStatus(false);
    }
  } else {
    setCloudStatus(false);
  }
}

async function syncFromFirestore(notify = false) {
  if (!window.db || !window.fs) {
    setCloudStatus(false);
    return;
  }
  try {
    const querySnapshot = await window.fs.getDocs(window.fs.collection(window.db, "patients"));
    const remotePatients = [];
    querySnapshot.forEach((doc) => {
      remotePatients.push(doc.data());
    });
    
    setCloudStatus(true);

    if (remotePatients.length > 0) {
      safeSetItem(LS_P, JSON.stringify(remotePatients));
      render();
    }
    if (notify) toast("Synced with Cloud Firestore");
  } catch (err) {
    console.error("Error pulling from Firestore:", err);
    setCloudStatus(false);
    if (notify) toast("Cloud sync failed");
  }
}

function nextId(){
  const yy=new Date().toLocaleDateString("en-CA").slice(2,4).replace("-","");
  const y=String(new Date().getFullYear()).slice(2);
  let c={}; try{c=JSON.parse(safeGetItem(LS_C))||{}}catch(e){}
  c[y]=(c[y]||0)+1; safeSetItem(LS_C,JSON.stringify(c));
  return String(c[y]).padStart(4,"0")+"/"+y;
}
function uid(){ return "v"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toLocaleDateString("en-CA"); }

/* ============ AGE CALCULATIONS ============ */
function parseD(s){ if(!s) return null; const p=String(s).slice(0,10).split("-"); if(p.length<3) return null; const d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?null:d; }
function fmtDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ageFromDob(dob){ const b=parseD(dob); if(!b) return null; const n=new Date(); let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth()); if(n.getDate()<b.getDate())m--; if(m<0)m=0; return {years:Math.floor(m/12),months:m%12}; }
function formatAge(y,m){ y=(y===""||y==null)?null:+y; m=(m===""||m==null)?null:+m; const p=[]; if(y!=null&&y>0)p.push(y+" yrs"); if(m!=null&&m>0)p.push(m+" months"); if(!p.length&&y===0)return "0 yrs"; return p.join(" "); }
function parseAge(s){ s=String(s||""); const y=/(\d+)\s*yr/i.exec(s), m=/(\d+)\s*mon/i.exec(s); return {years:y?y[1]:"",months:m?m[1]:""}; }
function elapsedMonths(from){ const f=parseD(from); if(!f)return 0; const n=new Date(); let m=(n.getFullYear()-f.getFullYear())*12+(n.getMonth()-f.getMonth()); if(n.getDate()<f.getDate())m--; return Math.max(m,0); }
function displayAge(p){ if(!p)return ""; if(p.dob){const a=ageFromDob(p.dob); if(a)return formatAge(a.years,a.months);} if(p.age_recorded_at&&p.age){const b=parseAge(p.age); const t=(+b.years||0)*12+(+b.months||0)+elapsedMonths(p.age_recorded_at); return formatAge(Math.floor(t/12),t%12);} return p.age||""; }

/* ============ IMMUNIZATION SCHEDULE ============ */
const SCHEDULE=[
["Birth","BCG","day",0],["Birth","Hepatitis B-1 (BD)","day",0],["Birth","OPV 0","day",0],
["6th Week","DTwP/DTaP-1","week",6],["6th Week","IPV-1","week",6],["6th Week","Hib-1","week",6],["6th Week","Hep B-2","week",6],["6th Week","Rotavirus-1","week",6],["6th Week","PCV-1","week",6],
["10th Week","DTwP/DTaP-2","week",10],["10th Week","IPV-2","week",10],["10th Week","Hib-2","week",10],["10th Week","Hep B-3","week",10],["10th Week","Rotavirus-2","week",10],["10th Week","PCV-2","week",10],
["14th Week","DTwP/DTaP-3","week",14],["14th Week","IPV-3","week",14],["14th Week","Hib-3","week",14],["14th Week","Hep B-4","week",14],["14th Week","Rotavirus-3","week",14],["14th Week","PCV-3","week",14],
["6th Month","Influenza (IIV)-1","month",6],["7th Month","Influenza (IIV)-2","month",7],
["6-9 Month","Typhoid Conjugate Vaccine","month",9],["9th Month","MMR-1","month",9],
["12th Month","Hepatitis A","month",12],["12th Month","JE-1","month",12],["13th Month","JE-2","month",13],
["15th Month","MMR-2","month",15],["15th Month","Varicella-1","month",15],["15th Month","PCV Booster","month",15],
["16-18th Month","DTwP/DTaP-B1","month",16],["16-18th Month","Hib-B1","month",16],["16-18th Month","IPV-B1","month",16],
["18-19th Month","Hep A-2","month",18],["18-19th Month","Varicella-2","month",18],
["4-6 Years","DTwP/DTaP-B2","year",4],["4-6 Years","IPV-B2","year",4],["4-6 Years","MMR-3","year",4],
["10-12 Years","Tdap","year",10],["10-12 Years","HPV","year",10]
];
function addOffset(d,unit,value){ const nd=new Date(d.getTime()); if(unit==="day"){nd.setDate(nd.getDate()+value);return nd;} if(unit==="week"){nd.setDate(nd.getDate()+value*7);return nd;} let months=unit==="year"?value*12:value; const day=nd.getDate(); nd.setDate(1); nd.setMonth(nd.getMonth()+months); const last=new Date(nd.getFullYear(),nd.getMonth()+1,0).getDate(); nd.setDate(Math.min(day,last)); return nd; }
function generateSchedule(dob,existing){ const b=parseD(dob); if(!b)return []; const prev={}; (existing||[]).forEach(r=>prev[r.vaccine]=r); return SCHEDULE.map(([label,vac,unit,val])=>{ const old=prev[vac]||{}; return {age_label:label,vaccine:vac,due_date:fmtDate(addOffset(b,unit,val)),given_date:old.given_date||"",batch_no:old.batch_no||"",remarks:old.remarks||""}; }); }
function reflowSchedule(rows,dob){ if(!dob)return; const pristine=generateSchedule(dob); const orig={}; pristine.forEach(r=>orig[r.vaccine]=r.due_date); const groups=[]; rows.forEach(r=>{ if(groups.length&&groups[groups.length-1].label===r.age_label)groups[groups.length-1].members.push(r); else groups.push({label:r.age_label,members:[r]}); }); let prevEff=null; groups.forEach(g=>{ let gd=parseD(orig[g.members[0].vaccine])||parseD(g.members[0].due_date); const given=g.members.map(m=>parseD(m.given_date)).filter(Boolean); if(given.length){ gd=new Date(Math.max(...given.map(d=>d.getTime()))); } else if(prevEff){ const mn=addOffset(prevEff,"month",1); if(!gd||mn>gd)gd=mn; } if(gd){ g.members.forEach(m=>{ if(!m.given_date)m.due_date=fmtDate(gd); }); } const eff=[gd,...given].filter(Boolean); if(eff.length)prevEff=new Date(Math.max(...eff.map(d=>d.getTime()))); }); }
function buildSchedule(dob,existing){ const rows=generateSchedule(dob,existing); reflowSchedule(rows,dob); return rows; }

function sexKey(s){ return s==="Male"?"boys":s==="Female"?"girls":null; }
function num(s){ if(!s)return null; const m=parseFloat(String(s).replace(/[^0-9.]/g,"")); return isNaN(m)?null:m; }
function ageMonths(dob,ds){ const a=parseD(dob),b=parseD(ds); if(!a||!b)return null; return Math.max(0,Math.round(((b-a)/(1000*60*60*24*30.4375))*10)/10); }
function interp(xs,ys,x){ if(x<=xs[0])return ys[0]; if(x>=xs[xs.length-1])return ys[ys.length-1]; for(let i=1;i<xs.length;i++){ if(x<=xs[i]){ const t=(x-xs[i-1])/(xs[i]-xs[i-1]); return Math.round((ys[i-1]+t*(ys[i]-ys[i-1]))*10)/10; } } return ys[ys.length-1]; }

function svgChart(title,unit,xLabel,color,xs,bands,child){
  const W=560,H=240,pad=44;
  const allY=[...bands.P3,...bands.P50,...bands.P97,...child.map(c=>c.y)];
  const allX=[...xs,...child.map(c=>c.x)];
  const xmin=Math.min(...allX),xmax=Math.max(...allX);
  const ymin=Math.min(...allY)*0.9,ymax=Math.max(...allY)*1.05;
  const mx=x=>pad+(xmax===xmin?0:(x-xmin)/(xmax-xmin))*(W-pad-10);
  const my=y=>H-pad-(ymax===ymin?0:(y-ymin)/(ymax-ymin))*(H-pad-14);
  const path=(ys,dash,col)=>{ let d=""; xs.forEach((x,i)=>{ d+=(i?"L":"M")+mx(x).toFixed(1)+" "+my(ys[i]).toFixed(1)+" "; }); return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.5" ${dash?'stroke-dasharray="4 3"':''}/>`; };
  let ticks="";
  for(let i=0;i<=4;i++){ const yy=pad+i*(H-pad-14)/4; const v=(ymax-(ymax-ymin)*i/4).toFixed(0); ticks+=`<line x1="${pad}" y1="${yy}" x2="${W-10}" y2="${yy}" stroke="#EEF2F7"/><text x="${pad-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="#94A3B8">${v}</text>`; }
  const childLine=child.length? `<polyline points="${child.map(c=>mx(c.x).toFixed(1)+","+my(c.y).toFixed(1)).join(" ")}" fill="none" stroke="${color}" stroke-width="2.6"/>`+child.map(c=>`<circle cx="${mx(c.x).toFixed(1)}" cy="${my(c.y).toFixed(1)}" r="3.6" fill="${color}"/>`).join("") : "";
  return `<div class="chart"><div class="ct">${title}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="220" preserveAspectRatio="xMidYMid meet">
    ${ticks}
    ${path(bands.P97,true,"#CBD5E1")}${path(bands.P50,false,"#94A3B8")}${path(bands.P3,true,"#CBD5E1")}
    ${childLine}
    <text x="${W/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="#64748B">${xLabel}</text>
    <text x="12" y="14" font-size="10" fill="#64748B">${unit}</text>
    </svg>
    <div class="legend">— WHO P50 &nbsp; ┄ P3/P97 &nbsp; <b style="color:${color}">● This child</b></div></div>`;
}

function growthHTML(p){
  const visits=p.visits||[], dob=p.dob, sk=sexKey(p.sex);
  if(dob&&sk){
    const collect=(field)=>{ const pts=[]; visits.forEach(v=>{const a=ageMonths(dob,v.date_of_visit),val=num(v[field]); if(a!=null&&val!=null)pts.push({x:a,y:val});}); return pts.sort((a,b)=>a.x-b.x); };
    const w=collect("wt"),h=collect("ht"),hc=collect("hc");
    const wfh=[]; visits.forEach(v=>{const ht=num(v.ht),wt=num(v.wt); if(ht!=null&&wt!=null&&ht>=45&&ht<=120)wfh.push({x:ht,y:wt});}); wfh.sort((a,b)=>a.x-b.x);
    if(!w.length&&!h.length&&!hc.length&&!wfh.length) return `<div class="empty">No Ht/Wt recorded yet. Add measurements in visits to see WHO percentile charts.</div>`;
    const maxA=Math.max(12,...[...w,...h,...hc].map(p=>p.x));
    const xs=WHO_AGES.filter(a=>a<=maxA+0.01);
    const band=(measure)=>({P3:xs.map(a=>interp(WHO_AGES,WHO[measure][sk].P3,a)),P50:xs.map(a=>interp(WHO_AGES,WHO[measure][sk].P50,a)),P97:xs.map(a=>interp(WHO_AGES,WHO[measure][sk].P97,a))});
    let out=`<p class="tiny">Plotted against WHO standards (${sk}).</p>`;
    out+=svgChart("Weight-for-age","kg","Age (months)","#10B981",xs,band("weight"),w);
    out+=svgChart("Height/Length-for-age","cm","Age (months)","#4F46E5",xs,band("height"),h);
    if(hc.length)out+=svgChart("Head circumference-for-age","cm","Age (months)","#F59E0B",xs,band("headcirc"),hc);
    if(wfh.length){ const wb={P3:WFH_HEIGHTS.map(x=>interp(WFH_HEIGHTS,WHO_WFH[sk].P3,x)),P50:WFH_HEIGHTS.map(x=>interp(WFH_HEIGHTS,WHO_WFH[sk].P50,x)),P97:WFH_HEIGHTS.map(x=>interp(WFH_HEIGHTS,WHO_WFH[sk].P97,x))}; out+=svgChart("Weight-for-height","kg","Height (cm)","#8B5CF6",WFH_HEIGHTS,wb,wfh); }
    return out;
  }
  const data=visits.map(v=>({d:(v.date_of_visit||"").slice(5),h:num(v.ht),w:num(v.wt)})).filter(x=>x.h!=null||x.w!=null);
  if(!data.length)return `<div class="empty">No Ht/Wt recorded yet.</div>`;
  return `<p class="tiny">${dob?"":"Add Date of Birth & Sex to overlay WHO percentile bands."}</p>`+
    `<table class="vtable"><tr><th>Date</th><th>Height</th><th>Weight</th></tr>`+data.map(d=>`<tr><td>${d.d}</td><td>${d.h??"-"}</td><td>${d.w??"-"}</td></tr>`).join("")+`</table>`;
}

function doRegister(){
  const name=val("r_name"),sex=val("r_sex"),dob=val("r_dob");
  const ag=readAge("r_age",dob);
  if(!name||!ag.age||!sex){ toast("Name, Age and Sex are required"); return; }
  
  const v=emptyVisit(); 
  v.date_of_visit=val("r_dov")||todayISO(); 
  v.ht=val("r_ht"); v.wt=val("r_wt"); v.hc=val("r_hc"); v.bp=val("r_bp");
  
  const pid=nextId();
  const patient={
    patient_id:pid, name, age:ag.age, sex, phone:val("r_phone"), dob,
    age_recorded_at:dob?"":todayISO(), visits:[v], vaccinations:dob?buildSchedule(dob):[],
    next_vaccination:null, created_at:new Date().toISOString()
  };
  
  const arr=loadPatients(); arr.push(patient); savePatients(arr);

  STAFF_SUB="register"; render();
}

// DELETION PASSWORD: 654321
async function deletePatient(pid){
  const pw = prompt("Enter Password (654321) to delete this record:");
  if (pw !== "654321") {
    if (pw !== null) toast("Incorrect password");
    return;
  }

  if (!confirm(`Permanently delete patient ID ${pid}?`)) return;

  let arr = loadPatients().filter(p => p.patient_id !== pid);
  safeSetItem(LS_P, JSON.stringify(arr));

  if (window.db && window.fs) {
    try {
      const docId = String(pid).replace(/\//g, "_");
      await window.fs.deleteDoc(window.fs.doc(window.db, "patients", docId));
      toast(`Patient ${pid} deleted permanently`);
    } catch (err) {
      toast("Deleted locally");
    }
  } else {
    toast(`Patient ${pid} deleted locally`);
  }

  document.getElementById("s_selected").innerHTML = "";
  if (document.getElementById("s_q")) doSearch();
  render();
}

function alertsView(){
  const rows=computeOverdue();
  return `<div class="card">
    <h3>⚠️ Vaccine Alerts <span class="badge">${rows.length}</span></h3>
    ${rows.length?`<table><tr><th>Patient</th><th>Vaccine</th><th>Due</th><th>Status</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="tiny mono">${r.patient_id}</div></td><td>${esc(r.vaccine||"Next dose")}</td><td class="mono tiny">${r.due_date}</td><td>${r.status}</td></tr>`).join("")}</table>`:'<div class="empty">No vaccinations due.</div>'}
  </div>`;
}

function computeOverdue(){
  const today=parseD(todayISO()), horizon=addOffset(today,"day",7); const out=[];
  loadPatients().forEach(p=>{ const nv=p.next_vaccination; if(!nv||!nv.due_date)return; const due=parseD(nv.due_date); if(!due||due>horizon)return; const days=Math.round((today-due)/(1000*60*60*24)); out.push({patient_id:p.patient_id,name:p.name,phone:p.phone,vaccine:nv.vaccine,note:nv.note,due_date:nv.due_date,days,status:due<today?"overdue":(due.getTime()===today.getTime()?"due_today":"upcoming")}); });
  out.sort((a,b)=>b.days-a.days); return out; }

    <div class="mt"><button class="btn btn-p" style="width:100%" onclick="unlockSettings()">Unlock Settings</button></div></div>`;

  return `<div class="card">
    <h3>⚙️ Database Management</h3>
    <div class="divider"></div>
    <div>
      <h4 style="margin:0 0 6px;">Delete Individual Patient</h4>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input id="set_del_q" placeholder="Enter Patient ID or Name" onkeydown="if(event.key==='Enter')searchDeletePatient()"/>
        <button class="btn btn-p" onclick="searchDeletePatient()">Search</button>
      </div>
      <div id="set_del_results" class="mt"></div>
    </div>
    <div class="divider"></div>
    <div style="background:#FEF2F2;border:1px solid #FCA5A5;padding:16px;border-radius:12px;">
      <h4 style="margin:0 0 6px;color:#991B1B">🚨 Factory Reset Database</h4>
      <p class="tiny" style="color:#7F1D1D">Permanently erases ALL local and Cloud Firestore patient records!</p>
      <div class="mt"><button class="btn btn-danger" onclick="factoryResetDatabase()">🚨 Perform Factory Reset</button></div>
    </div>
  </div>`;
}

function unlockSettings() {
  if (val("settings_pw") === "654321") {
    SETTINGS_UNLOCKED = true;
    render();
  } else {
    toast("Incorrect password (use 654321)");
  }
}

function searchDeletePatient() {
  const q = val("set_del_q").trim().toLowerCase();
  const res = loadPatients().filter(p => !q || p.patient_id.toLowerCase().includes(q) || (p.name || "").toLowerCase().includes(q));
  const el = document.getElementById("set_del_results");
  if (!res.length) { el.innerHTML = `<p class="tiny">No matching patient found.</p>`; return; }
  el.innerHTML = res.map(p => `<div class="qcard">
    <div><b>${esc(p.name)}</b> <span class="badge mono">${p.patient_id}</span></div>
    <button class="btn btn-danger btn-sm" onclick="deletePatient('${p.patient_id}')">🗑️ Delete</button>
  </div>`).join("");
}

async function factoryResetDatabase() {
  const pw = prompt("Re-enter password (654321) to confirm Factory Reset:");
  if (pw !== "654321") {
    if (pw !== null) toast("Incorrect password");
    return;
  }

  if (!confirm("Are you ABSOLUTELY sure? ALL data will be wiped!")) return;

  safeRemoveItem(LS_P);
  safeRemoveItem(LS_C);

  if (window.db && window.fs) {
    try {
      const querySnapshot = await window.fs.getDocs(window.fs.collection(window.db, "patients"));
      for (const docSnapshot of querySnapshot.docs) {
        await window.fs.deleteDoc(window.fs.doc(window.db, "patients", docSnapshot.id));
      }
      toast("Database wiped completely");
    } catch (err) {
      toast("Local wiped, cloud wipe failed");
    }
  } else {
    toast("Local wiped");
  }

  render();
}

/* ============ DOCTOR MODULE ============ */
let DOC_UNLOCKED=false, DOC_TAB="waiting", DOC_FILTER="", DOC_TODAY=true;

function doctorView(){
  if(!DOC_UNLOCKED) return `<div class="card" style="max-width:380px;margin:20px auto;text-align:center">
    <div style="font-size:28px">🔒</div><h3>Doctor Module</h3><p class="sub">Enter password to access clinical records.</p>
    <input id="doc_pw" type="password" placeholder="Password (123456)" style="text-align:center" onkeydown="if(event.key==='Enter')unlockDoc()"/>
    <div class="mt"><button class="btn btn-p" style="width:100%" onclick="unlockDoc()">Unlock</button></div></div>`;
  
  const items = queueItems(DOC_TAB);
  return `<div class="card mb"><div class="flexb"><input id="doc_filter" value="${esc(DOC_FILTER)}" placeholder="Filter by ID, phone or name" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter'){DOC_FILTER=this.value;render()}"/>
    <button class="btn btn-o btn-sm" onclick="DOC_FILTER=document.getElementById('doc_filter').value;render()">Apply</button></div></div>
    <div class="subtabs">
      <button class="subtab ${DOC_TAB==="waiting"?"active":""}" onclick="DOC_TAB='waiting';render()">⏳ Waiting <span class="badge">${queueItems('waiting').length}</span></button>
      <button class="subtab ${DOC_TAB==="treated"?"active":""}" onclick="DOC_TAB='treated';render()">✅ Treated <span class="badge">${queueItems('treated').length}</span></button>
    </div>
    ${items.length?items.map((it,i)=>qcard(it,i+1,DOC_TAB==="treated")).join(""):`<div class="empty">${DOC_TAB==="waiting"?"No patients waiting.":"No treated patients."}</div>`}`;
}

function unlockDoc(){ 
  if(val("doc_pw")==="123456"){ DOC_UNLOCKED=true; render(); }
  else toast("Incorrect password (use 123456)"); 
}

function queueItems(status){
  const f=DOC_FILTER.trim().toLowerCase(), today=todayISO(); const out=[];
  loadPatients().forEach(p=>{ if(f&&!(p.patient_id.toLowerCase().includes(f)||(p.name||"").toLowerCase().includes(f)||(p.phone||"").toLowerCase().includes(f)))return;
    (p.visits||[]).forEach(v=>{ if((v.status||"waiting")!==status)return; if(DOC_TODAY&&(v.date_of_visit||"").slice(0,10)!==today)return; out.push({p,v}); }); });
  return out;
}

function qcard(it,token,treated){
  const p=it.p,v=it.v;
  return `<div class="qcard">
    <div style="display:flex;align-items:center;gap:10px;min-width:0">
      <div class="token"><span class="t1">Token</span><span class="t2">${token}</span></div>
      <div><div><b>${esc(p.name)}</b> <span class="badge mono">${p.patient_id}</span></div>
      <div class="tiny">${esc(displayAge(p))} • ${esc(p.sex)}</div></div>
    </div>
    <div style="display:flex;gap:4px;">
      <button class="btn btn-g btn-sm" title="Vaccination" onclick="openImmun('${p.patient_id}')">💉</button>
      <button class="btn btn-g btn-sm" title="Growth" onclick="openGrowth('${p.patient_id}')">📈</button>
      <button class="btn btn-p btn-sm" onclick="openTreat('${p.patient_id}','${v.id}')">🩺 Attend</button>
    </div></div>`;
}

function openGrowth(pid){ const p=getP(pid); showModal(`<h2>📈 Growth Tracking • ${esc(p.name)}</h2>${growthHTML(p)}<div class="right mt"><button class="btn btn-o" onclick="closeModal()">Close</button></div>`,true); }

function openTreat(pid,vid){
  const p=getP(pid); const v=p.visits.find(v=>v.id===vid); treatCtx={pid,vid};
  showModal(`<h2>🩺 ${esc(p.name)} • ${pid}</h2>
  <div class="field mb"><label class="lbl">Complaints</label><textarea id="t_comp" rows="2">${esc(v.complaints||"")}</textarea></div>
  <div class="field mt"><label class="lbl">Treatment</label><textarea id="t_treat" rows="3">${esc(v.treatment||"")}</textarea></div>
  <div class="right mt"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="saveTreat()">💾 Save & Mark Treated</button></div>`);
}

function saveTreat(){
  const {pid,vid}=treatCtx;
  updateP(pid,x=>{ const v=x.visits.find(v=>v.id===vid); v.complaints=val("t_comp"); v.treatment=val("t_treat"); v.status="treated"; });
  closeModal(); toast("Saved"); DOC_TAB="treated"; render();
}

function openImmun(pid){ renderImmun(pid); }
function renderImmun(pid){
  const p=getP(pid);
  if(!p.dob&&(!p.vaccinations||!p.vaccinations.length)){
    showModal(`<h2>💉 Immunization • ${esc(p.name)}</h2><div class="empty" style="padding:24px">Set DOB to generate schedule.<div class="mt"><input id="im_dob" type="date" max="${todayISO()}" style="width:auto"/><button class="btn btn-p btn-sm" onclick="genImmun('${pid}')">Generate</button></div></div>`,true);
    return;
  }
  const rows=p.vaccinations||[];
  showModal(`<h2>💉 Immunization • ${esc(p.name)}</h2><div style="max-height:50vh;overflow:auto;"><table class="vtable"><tr><th>Age</th><th>Vaccine</th><th>Due</th><th>Given</th></tr>${rows.map(r=>`<tr><td>${esc(r.age_label)}</td><td>${esc(r.vaccine)}</td><td>${esc(r.due_date)}</td><td>${esc(r.given_date||"-")}</td></tr>`).join("")}</table></div>`,true);
}
function genImmun(pid){ const dob=val("im_dob"); if(!dob){toast("Select DOB");return;} updateP(pid,x=>{x.dob=dob;x.vaccinations=buildSchedule(dob,x.vaccinations);}); renderImmun(pid); }

/* ============ REPORTS MODULE ============ */
let RS=addDays(-29), RE=todayISO();
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toLocaleDateString("en-CA"); }

function reportData(){
  const rows=[]; loadPatients().forEach(p=>{ (p.visits||[]).forEach(v=>{ const d=(v.date_of_visit||"").slice(0,10); if(d&&d>=RS&&d<=RE)rows.push({patient_id:p.patient_id,name:p.name,age:displayAge(p),sex:p.sex,date:d,type:v.visit_type,cat:v.patient_category}); }); });
  rows.sort((a,b)=>a.date.localeCompare(b.date));
  const s={total:rows.length,new:0,old:0,fresh:0,followup:0,subsequent:0};
  rows.forEach(r=>{ if(r.cat==="new")s.new++;else s.old++; if(s[r.type]!=null)s[r.type]++; });
  return {rows,s};
}

function reportsView(){
  const {rows,s}=reportData();
  return `<div class="card mb"><div class="flexb">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
      <div class="field"><label class="lbl">From</label><input type="date" id="rp_s" value="${RS}" onchange="RS=this.value;render()"/></div>
      <div class="field"><label class="lbl">To</label><input type="date" id="rp_e" value="${RE}" onchange="RE=this.value;render()"/></div>
      <button class="btn btn-o btn-sm" onclick="RS=todayISO();RE=todayISO();render()">Today</button>
      <button class="btn btn-o btn-sm" onclick="RS=addDays(-6);RE=todayISO();render()">This Week</button>
      <button class="btn btn-o btn-sm" onclick="RS=addDays(-29);RE=todayISO();render()">This Month</button>
    </div>
    <button class="btn btn-a btn-sm" onclick="printReport()">🖨️ Print / Save PDF</button>
  </div></div>
  <div class="metrics">
    ${metric("Total Attended",s.total)}${metric("New Patients",s.new)}${metric("Old Patients",s.old)}${metric("Fresh",s.fresh)}${metric("Follow-up",s.followup)}${metric("Subsequent",s.subsequent)}
  </div>
  <div class="card"><div class="flexb mb"><h3>Patient List</h3><span class="tiny">${rows.length} record(s)</span></div>
  <div style="max-height:420px;overflow:auto"><table><tr><th>ID</th><th>Name</th><th>Age</th><th>Sex</th><th>Date</th><th>Type</th><th>Category</th></tr>
  ${rows.length?rows.map(r=>`<tr><td class="mono">${r.patient_id}</td><td>${esc(r.name)}</td><td>${esc(r.age)}</td><td>${esc(r.sex)}</td><td class="mono tiny">${r.date}</td><td style="text-transform:capitalize">${r.type}</td><td>${r.cat==="new"?"New":"Old"}</td></tr>`).join(""):'<tr><td colspan="7" style="text-align:center;color:#94A3B8;padding:24px">No records for this range.</td></tr>'}</table></div></div>`;
}

function metric(l,v){ return `<div class="metric"><div class="m-l">${l}</div><div class="m-v">${v}</div></div>`; }

function printReport(){
  const {rows,s}=reportData();
  const css=`body{font-family:Segoe UI,Arial,sans-serif;color:#1E293B;padding:20px}.b{color:#4F46E5;font-size:24px;font-weight:800;margin:0}.s{color:#64748B;font-size:12px}.cards{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.c{border:1px solid #E2E8F0;border-radius:8px;padding:10px;min-width:120px}.c .l{font-size:10px;text-transform:uppercase;color:#64748B;font-weight:700}.c .v{font-size:22px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#4F46E5;color:#fff;text-align:left;padding:6px}td{padding:6px;border-bottom:1px solid #E2E8F0}`;
  const cards=[["Total Attended",s.total],["New",s.new],["Old",s.old],["Fresh",s.fresh],["Follow-up",s.followup],["Subsequent",s.subsequent]].map(c=>`<div class="c"><div class="l">${c[0]}</div><div class="v">${c[1]}</div></div>`).join("");
  const tr=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.patient_id}</td><td>${esc(r.name)}</td><td>${esc(r.age)}</td><td>${esc(r.sex)}</td><td>${r.date}</td><td>${r.type}</td><td>${r.cat}</td></tr>`).join("");
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Vishwa Hospital Report</title><style>${css}</style></head><body><p class="b">Vishwa Hospital</p><p class="s">Patient Report — ${RS} to ${RE}</p><div class="cards">${cards}</div><h3>Patient List</h3><table><tr><th>#</th><th>ID</th><th>Name</th><th>Age</th><th>Sex</th><th>Date</th><th>Type</th><th>Category</th></tr>${tr||'<tr><td colspan=8>No records</td></tr>'}</table><script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>`;
  const w=window.open("","_blank"); w.document.write(html); w.document.close();
}

/* ============ MODALS & UTILS ============ */
function openEdit(pid){ const p=getP(pid); showModal(`<h2>Edit Patient</h2><div class="field mb"><label class="lbl">Name</label><input id="e_name" value="${esc(p.name)}"/></div><div class="right mt"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="saveEdit('${pid}')">Save</button></div>`); }
function saveEdit(pid){ updateP(pid,x=>{x.name=val("e_name");}); closeModal(); toast("Updated"); selectPatient(pid); }

function openNewVisit(pid){ const v=emptyVisit(); updateP(pid,x=>x.visits.push(v)); toast("Visit added"); selectPatient(pid); }

function val(id){ const e=document.getElementById(id); return e?e.value.trim():""; }
function showModal(html,wide){ const m=document.getElementById("modal"); m.className="modal"+(wide?" wide":""); m.innerHTML=html; document.getElementById("overlay").classList.add("show"); }
function closeModal(){ document.getElementById("overlay").classList.remove("show"); }

function backupData(){
  const data={patients:loadPatients(),exported_at:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="vishwa_hospital_backup.json"; a.click();
}

function restoreData(input){
  const f=input.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=e=>{ try{ const d=JSON.parse(e.target.result); if(!d.patients)throw 0; savePatients(d.patients); toast("Data restored"); render(); }catch(err){ toast("Invalid backup"); } };
  rd.readAsText(f); input.value="";
}

render();
</script>
